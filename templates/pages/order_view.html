<!DOCTYPE html>
<html>
<head>
  <title>My Orders</title>
</head>
<body>
  <h1>My Orders</h1>
  <p>This page will show customer orders.</p>

  {% if orders %}
    <ul>
      {% for o in orders %}
        <li>
          Order #{{ o.id }} — {{ o.status }} — {{ o.total }} €
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No orders found.</p>
  {% endif %}

  <p><a href="/">Back to home</a></p>
</body>
</html>
