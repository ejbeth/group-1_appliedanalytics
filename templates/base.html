<!DOCTYPE html>
<html class="h-full bg-gray-900" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ title or "My Webpage" }}</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
  </head>

  <body class="h-full">
    <div class="min-h-full">
      <nav class="bg-gray-800/50">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <div class="flex h-16 items-center justify-between">
            <div class="flex items-center">
              <div class="shrink-0">
                <img
                  src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500"
                  alt="Your Company"
                  class="size-8"
                />
              </div>

              <!-- DESKTOP MENU -->
              <div class="hidden md:block">
                <div class="ml-10 flex items-baseline space-x-4">
                  <a href="{{ url_for('dashboard') }}"
                     class="rounded-md px-3 py-2 text-sm font-medium
                     {% if active == 'dashboard' %}bg-gray-950/50 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %}">
                    Dashboard
                  </a>

                  <a href="{{ url_for('team') }}"
                     class="rounded-md px-3 py-2 text-sm font-medium
                     {% if active == 'team' %}bg-gray-950/50 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %}">
                    Team
                  </a>

                  <a href="{{ url_for('projects') }}"
                     class="rounded-md px-3 py-2 text-sm font-medium
                     {% if active == 'projects' %}bg-gray-950/50 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %}">
                    Projects
                  </a>

                  <a href="{{ url_for('calendar') }}"
                     class="rounded-md px-3 py-2 text-sm font-medium
                     {% if active == 'calendar' %}bg-gray-950/50 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %}">
                    Calendar
                  </a>

                  <a href="{{ url_for('contacts') }}"
                     class="rounded-md px-3 py-2 text-sm font-medium
                     {% if active == 'contacts' %}bg-gray-950/50 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %}">
                    Contacts
                  </a>
                </div>
              </div>
            </div>

            <!-- RIGHT SIDE (mantido como no template) -->
            <div class="hidden md:block">
              <div class="ml-4 flex items-center md:ml-6">
                <button type="button"
                  class="relative rounded-full p-1 text-gray-400 hover:text-white focus:outline-2 focus:outline-offset-2 focus:outline-indigo-500">
                  <span class="absolute -inset-1.5"></span>
                  <span class="sr-only">View notifications</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    data-slot="icon" aria-hidden="true" class="size-6">
                    <path
                      d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"
                      stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </button>

                <el-dropdown class="relative ml-3">
                  <button
                    class="relative flex max-w-xs items-center rounded-full focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500">
                    <span class="absolute -inset-1.5"></span>
                    <span class="sr-only">Open user menu</span>
                    <img
                      src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80"
                      alt=""
                      class="size-8 rounded-full outline -outline-offset-1 outline-white/10" />
                  </button>

                  <el-menu anchor="bottom end" popover
                    class="w-48 origin-top-right rounded-md bg-gray-800 py-1 outline-1 -outline-offset-1 outline-white/10 transition transition-discrete [--anchor-gap:--spacing(2)] data-closed:scale-95 data-closed:transform data-closed:opacity-0 data-enter:duration-100 data-enter:ease-out data-leave:duration-75 data-leave:ease-in">
                    <a href="#"
                      class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-hidden">Your profile</a>
                    <a href="#"
                      class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-hidden">Settings</a>
                    <a href="#"
                      class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-hidden">Sign out</a>
                  </el-menu>
                </el-dropdown>
              </div>
            </div>

            <!-- MOBILE MENU BUTTON -->
            <div class="-mr-2 flex md:hidden">
              <button type="button" command="--toggle" commandfor="mobile-menu"
                class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-white/5 hover:text-white focus:outline-2 focus:outline-offset-2 focus:outline-indigo-500">
                <span class="absolute -inset-0.5"></span>
                <span class="sr-only">Open main menu</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                  data-slot="icon" aria-hidden="true" class="size-6 in-aria-expanded:hidden">
                  <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                  data-slot="icon" aria-hidden="true" class="size-6 not-in-aria-expanded:hidden">
                  <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- MOBILE MENU -->
        <el-disclosure id="mobile-menu" hidden class="block md:hidden">
          <div class="space-y-1 px-2 pt-2 pb-3 sm:px-3">
            <a href="{{ url_for('dashboard') }}"
               class="block rounded-md px-3 py-2 text-base font-medium
               {% if active == 'dashboard' %}bg-gray-950/50 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %}">
              Dashboard
            </a>

            <a href="{{ url_for('team') }}"
               class="block rounded-md px-3 py-2 text-base font-medium
               {% if active == 'team' %}bg-gray-950/50 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %}">
              Team
            </a>

            <a href="{{ url_for('projects') }}"
               class="block rounded-md px-3 py-2 text-base font-medium
               {% if active == 'projects' %}bg-gray-950/50 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %}">
              Projects
            </a>

            <a href="{{ url_for('calendar') }}"
               class="block rounded-md px-3 py-2 text-base font-medium
               {% if active == 'calendar' %}bg-gray-950/50 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %}">
              Calendar
            </a>

            <a href="{{ url_for('contacts') }}"
               class="block rounded-md px-3 py-2 text-base font-medium
               {% if active == 'contacts' %}bg-gray-950/50 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %}">
              Contacts
            </a>
          </div>
        </el-disclosure>
      </nav>

      <header class="relative bg-gray-800 after:pointer-events-none after:absolute after:inset-x-0 after:inset-y-0 after:border-y after:border-white/10">
        <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
          <h1 class="text-3xl font-bold tracking-tight text-white">
            {% block header_title %}{% endblock %}
          </h1>
        </div>
      </header>

      <main>
        <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
          {% block content %}{% endblock %}
        </div>
      </main>
    </div>
  </body>
</html>
